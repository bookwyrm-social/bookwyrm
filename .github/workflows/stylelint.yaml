name: Lint Stylesheets files (run `./bw-dev stylelint` to fix errors)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install modules
        working-directory: ./dev-tools
        run: npm install

      - name: Run Stylelint
        working-directory: ./dev-tools
        run: |
          ln -s ../bookwyrm bookwyrm
          npx stylelint stylelint bookwyrm/static/css \
            --config ./.stylelintrc.js --ignore-path ./.stylelintignore
